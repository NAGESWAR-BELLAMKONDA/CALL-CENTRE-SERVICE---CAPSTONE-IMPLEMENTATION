name: Validate and Deploy Call-Centre Analytics
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate presentation dataset and application seed
        run: python scripts/validate_dataset.py
      - name: Run backend API and SSE smoke test
        run: node scripts/smoke_test.mjs
      - name: Check backend JavaScript syntax
        run: node --check server.js
      - name: Check dashboard JavaScript syntax
        run: python scripts/check_frontend.py
      - name: Check application entry point
        run: test -s index.html
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
